<style>
/* Layout concept: editorial grid on a quiet off-white ground. A schematic soil profile (depth ruler in cm) is the signature figure; hairline rules, no boxed cards. */
:root{
  --bg:#F5F8F5;--surface:#FFFFFF;--soft:#EAF1EB;--ink:#25352C;--ink2:#4A5D51;--head:#123F2A;--green:#3D7955;--accent:#2F6B49;--rule:#CBD9CE;--strata:#123F2A;
  --btn-bg:#123F2A;--btn-ink:#F5F8F5;--btn-hover:#3D7955;
  --band:#123F2A;--band-ink:#F5F8F5;--band-ink2:#B9D0C0;--band-rule:rgba(245,248,245,.24);--band-accent:#9ED8B5;
  --s1:#123F2A;--s2:#3D7955;--s3:#A8701A;--s4:#3F6C8F;--s5:#9A4F3C;--s6:#6C7A71;
  --warn-bg:#FFF4D1;--warn-ink:#4F3A00;--warn-rule:#E2CB85;
  --serif:Lora,Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:clamp(16px,4vw,48px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1B14;--surface:#142619;--soft:#172D20;--ink:#E2EBE4;--ink2:#A3B8A9;--head:#E8F1EA;--green:#6FB58B;--accent:#8CCDA6;--rule:#2A4434;--strata:#8CCDA6;
  --btn-bg:#8CCDA6;--btn-ink:#07110B;--btn-hover:#A9DFBF;
  --band:#07110B;--band-ink:#E8F1EA;--band-ink2:#A3B8A9;--band-rule:rgba(232,241,234,.2);--band-accent:#8CCDA6;
  --s1:#CFE8D8;--s2:#6FB58B;--s3:#E0A94B;--s4:#7FB0D8;--s5:#E08A74;--s6:#9BAAA0;
  --warn-bg:#2D2410;--warn-ink:#F1DDA0;--warn-rule:#5A4A1C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1B14;--surface:#142619;--soft:#172D20;--ink:#E2EBE4;--ink2:#A3B8A9;--head:#E8F1EA;--green:#6FB58B;--accent:#8CCDA6;--rule:#2A4434;--strata:#8CCDA6;
  --btn-bg:#8CCDA6;--btn-ink:#07110B;--btn-hover:#A9DFBF;
  --band:#07110B;--band-ink:#E8F1EA;--band-ink2:#A3B8A9;--band-rule:rgba(232,241,234,.2);--band-accent:#8CCDA6;
  --s1:#CFE8D8;--s2:#6FB58B;--s3:#E0A94B;--s4:#7FB0D8;--s5:#E08A74;--s6:#9BAAA0;
  --warn-bg:#2D2410;--warn-ink:#F1DDA0;--warn-rule:#5A4A1C;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img,svg{max-width:100%}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--head)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3,h4{font-family:var(--serif);color:var(--head);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(1.85rem,3.6vw,2.7rem);line-height:1.14}
h3{font-size:1.35rem;line-height:1.28}
p{margin:0}
ul,ol{margin:0;padding:0}
.muted{color:var(--ink2)}
.sm{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-9999px;top:8px;background:var(--btn-bg);color:var(--btn-ink);padding:8px 14px;z-index:40;border-radius:2px}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font:600 .72rem/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.6;max-width:62ch}
.rule-top{border-top:1px solid var(--rule)}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--head)}
.mono{font:600 1.5rem/1 var(--serif);letter-spacing:-.03em}
.mono i{font-style:normal;color:var(--green)}
.wm{font:600 .72rem/1 var(--sans);letter-spacing:.28em;padding-left:12px;border-left:1px solid var(--rule)}
.nav{margin-left:auto;display:flex;gap:2px}
.nav a{padding:10px 12px;font:500 .72rem/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);text-decoration:none;border-bottom:2px solid transparent}
.nav a:hover{color:var(--head)}
.nav a[aria-current=page]{color:var(--head);border-bottom-color:var(--green)}
.icon-btn{background:none;border:1px solid var(--rule);color:var(--ink);width:38px;height:38px;border-radius:2px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--green)}
.menu-btn{display:none}
@media (max-width:960px){
  .menu-btn{display:grid;margin-left:auto}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--rule);padding:8px max(var(--gut),env(safe-area-inset-right,0px)) 16px max(var(--gut),env(safe-area-inset-left,0px));margin:0}
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid var(--rule);font-size:.8rem}
  .nav a[aria-current=page]{border-bottom-color:var(--green)}
}
@media (max-width:420px){.wm{display:none}}

/* buttons, tags */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;font:500 .9rem/1 var(--sans);letter-spacing:.02em;text-decoration:none;border:1px solid var(--head);color:var(--head);background:transparent;border-radius:2px;cursor:pointer}
.btn:hover{background:var(--soft);color:var(--head)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover);color:var(--btn-ink)}
.btn.sm{padding:9px 14px;font-size:.8125rem}
.btn[disabled]{opacity:.55;cursor:default}
.link-more{font:500 .875rem var(--sans);text-decoration:none;color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:2px;white-space:nowrap}
.phb{font:600 .625rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;border:1px dashed var(--ink2);color:var(--ink2);padding:3px 6px;border-radius:2px;white-space:nowrap}
.ph-text{background:var(--warn-bg);color:var(--warn-ink);padding:0 4px;border-radius:2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font:500 .75rem/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.status{display:inline-flex;align-items:center;gap:7px}
.status::before{content:"";width:8px;height:8px;border:1.5px solid var(--green);display:inline-block}
.st-in-progress::before{background:var(--green)}
.st-completed::before{background:var(--head);border-color:var(--head)}
.st-concept::before{border-style:dashed}
.notice{border:1px solid var(--warn-rule);background:var(--warn-bg);color:var(--warn-ink);padding:12px 16px;border-radius:2px;font-size:.9rem}
.notice.info{background:var(--soft);border-color:var(--rule);color:var(--ink)}
.empty{border:1px dashed var(--rule);padding:32px;text-align:center;color:var(--ink2)}
.empty p+p,.empty p+.btn{margin-top:12px}

/* sections */
.sec{padding-block:clamp(56px,8vw,112px)}
.sec.soft{background:var(--soft)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sec-head .eyebrow{margin-bottom:12px}
.page-head{padding-block:clamp(40px,7vw,88px) clamp(24px,4vw,40px)}
.page-head h1{font-size:clamp(2.4rem,5.4vw,4rem);line-height:1.05;margin:14px 0 20px}

/* figures */
.fig{display:block;width:100%;height:auto;aspect-ratio:4/3;background:var(--soft);color:var(--strata)}
.sec.soft .fig{background:var(--bg)}

/* hero */
.hero{padding-block:clamp(36px,6vw,84px) clamp(48px,7vw,96px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4.4fr);gap:clamp(32px,6vw,96px);align-items:start}
.hero-copy .eyebrow{margin-bottom:22px}
.name{font:500 clamp(3.2rem,10.4vw,8.4rem)/.9 var(--serif);letter-spacing:-.035em;display:flex;flex-direction:column;margin:0 0 clamp(24px,4vw,40px);color:var(--head)}
.name .it{font-style:italic;font-weight:400;color:var(--green);letter-spacing:-.02em;padding-left:.12em}
.positioning{list-style:none;display:flex;flex-wrap:wrap;margin:0 0 28px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.positioning li{flex:1 1 auto;padding:12px 18px 12px 0;margin-right:18px;font:500 .74rem/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.positioning li+li{border-left:1px solid var(--rule);padding-left:18px}
.hero .lead{margin-bottom:32px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:clamp(36px,5vw,56px)}
.triad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:0;border-top:1px solid var(--rule);padding-top:20px}
.triad dt{font:italic 500 1.25rem var(--serif);color:var(--head);margin-bottom:6px}
.triad dd{margin:0;font-size:.875rem;color:var(--ink2);line-height:1.5}
.hero-fig{margin:0;background:var(--soft);padding:clamp(16px,3vw,28px);justify-self:end;width:100%;max-width:460px}
.hero-fig svg{display:block;width:100%;height:auto}
.hero-fig figcaption{font-size:.75rem;color:var(--ink2);margin-top:12px;letter-spacing:.02em}
@media (max-width:920px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .hero-fig{justify-self:start;max-width:420px}
  .triad{grid-template-columns:minmax(0,1fr);gap:16px}
}

/* featured */
.feat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,5vw,72px)}
.feat a{color:inherit;text-decoration:none;display:block}
.feat-big .fig{aspect-ratio:3/2;margin-bottom:20px}
.feat-big h3{font-size:clamp(1.6rem,2.8vw,2.2rem);margin:10px 0 12px;line-height:1.18}
.feat a:hover h3,.proj-row:hover h3{color:var(--accent)}
.feat-side{display:flex;flex-direction:column}
.feat-small{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;padding-block:24px;border-top:1px solid var(--rule)}
.feat-small:first-child{border-top:none;padding-top:0}
.feat-small .fig{aspect-ratio:1/1}
.feat-small h3{font-size:1.2rem;margin:8px 0}
.more{display:inline-block;margin-top:12px;font:500 .875rem var(--sans);color:var(--accent)}
@media (max-width:860px){.feat{grid-template-columns:minmax(0,1fr)}.feat-small{grid-template-columns:96px minmax(0,1fr)}}

/* interests */
.interests{list-style:none;border-top:1px solid var(--rule)}
.interest{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,5fr) auto;gap:24px;align-items:center;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rule);padding:22px 0;color:var(--ink);cursor:pointer;font:inherit}
.interest .iname{font:500 clamp(1.4rem,2.6vw,2rem)/1.15 var(--serif);color:var(--head);transition:transform .2s,color .2s}
.interest .idesc{color:var(--ink2);font-size:.95rem}
.interest .icount{font:500 .75rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.interest:hover .iname{color:var(--accent);transform:translateX(6px)}
@media (max-width:760px){.interest{grid-template-columns:minmax(0,1fr);gap:6px}}

/* publications */
.pub{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,7fr) minmax(0,2.2fr);gap:24px;padding-block:28px;border-top:1px solid var(--rule)}
.pub:last-child{border-bottom:1px solid var(--rule)}
.pub-meta{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font:500 .75rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pub-meta .ptype{color:var(--accent)}
.pub-body h3{margin-bottom:8px}
.pub-body p{color:var(--ink2);max-width:64ch}
.pub-act{text-align:right}
@media (max-width:760px){.pub{grid-template-columns:minmax(0,1fr);gap:12px}.pub-meta{flex-direction:row;flex-wrap:wrap;align-items:center}.pub-act{text-align:left}}

/* data home */
.data-home{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,5vw,80px);align-items:start}
.data-home ul{list-style:none;margin:24px 0 28px;border-top:1px solid var(--rule)}
.data-home li{padding:12px 0;border-bottom:1px solid var(--rule);font-size:.95rem;color:var(--ink2)}
.data-home li strong{color:var(--ink);font-weight:600}
.chartbox{min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button,.chip{font:500 .8125rem var(--sans);padding:8px 14px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.tabs button:hover,.chip:hover{border-color:var(--green)}
.tabs button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.sample-note{font-size:.8125rem;color:var(--ink2);margin-top:12px}
@media (max-width:900px){.data-home{grid-template-columns:minmax(0,1fr)}}

/* chart */
.cw{position:relative;outline-offset:2px}
.cw svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--rule);stroke-width:1}
.ax{stroke:var(--ink2);stroke-width:1}
.tx{font:400 12px var(--sans);fill:var(--ink2)}
.cx{stroke:var(--ink2);stroke-dasharray:3 3}
.wmk{font-weight:700;letter-spacing:.12em;fill:var(--ink);opacity:.07;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);padding:8px 10px;font-size:.8125rem;line-height:1.5;min-width:120px;z-index:2}
.tip strong{display:block;color:var(--head);margin-bottom:2px}
.tip span{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip b{font-weight:600;font-variant-numeric:tabular-nums}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;font-size:.8125rem;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}

/* notes */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,56px)}
.note{border-top:2px solid var(--head);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.note h3{font-size:1.4rem}
.note p{color:var(--ink2);font-size:.95rem}
.note summary{cursor:pointer;color:var(--accent);font:500 .875rem var(--sans);margin-top:4px}
.note details p{margin-top:10px}
@media (max-width:860px){.notes{grid-template-columns:minmax(0,1fr)}}

/* about preview */
.about-prev{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,6vw,96px);align-items:center}
.monogram{font:500 clamp(7rem,20vw,15rem)/.8 var(--serif);letter-spacing:-.06em;color:var(--head);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:clamp(20px,4vw,40px) 0}
.monogram i{font-style:normal;color:var(--green)}
.about-prev h2{margin:12px 0 18px}
.about-prev .lead{margin-bottom:24px}
@media (max-width:820px){.about-prev{grid-template-columns:minmax(0,1fr)}}

/* band */
.band{background:var(--band);color:var(--band-ink)}
.band h2,.band h3{color:var(--band-ink)}
.band .eyebrow{color:var(--band-accent)}
.band a{color:var(--band-accent)}
.collab{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(28px,6vw,96px)}
.collab .lead{color:var(--band-ink2);margin-top:18px}
.collab-list{list-style:none;border-top:1px solid var(--band-rule)}
.collab-list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;padding:22px 0;border-bottom:1px solid var(--band-rule);text-decoration:none;color:var(--band-ink)}
.collab-list h3{font-size:1.5rem}
.collab-list p{color:var(--band-ink2);font-size:.95rem;grid-column:1}
.collab-list .arr{grid-row:1;grid-column:2;align-self:center;font-size:1.4rem;transition:transform .2s;color:var(--band-accent)}
.collab-list a:hover .arr{transform:translateX(6px)}
@media (max-width:860px){.collab{grid-template-columns:minmax(0,1fr)}}

/* footer */
.foot{background:var(--band);color:var(--band-ink2);padding-block:56px 40px;font-size:.9rem}
.foot-grid{display:grid;grid-template-columns:minmax(0,4fr) repeat(3,minmax(0,2fr));gap:32px}
.foot h4{font:600 .7rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--band-ink);margin-bottom:14px}
.foot ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.foot a{color:var(--band-ink2);text-decoration:none}
.foot a:hover{color:var(--band-ink);text-decoration:underline}
.foot .brand{color:var(--band-ink);margin-bottom:14px}
.foot .brand .mono i{color:var(--band-accent)}
.foot .brand .wm{border-color:var(--band-rule)}
.foot-base{margin-top:40px;padding-top:20px;border-top:1px solid var(--band-rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8125rem}
.foot .ph-link{opacity:.8}
@media (max-width:860px){.foot-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.foot-grid>:first-child{grid-column:1/-1}}

/* forms and controls */
label,legend{font:500 .8125rem var(--sans);color:var(--ink);display:block;margin-bottom:6px}
input[type=text],input[type=email],input[type=search],select,textarea{width:100%;font:400 1rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:11px 12px}
input:hover,select:hover,textarea:hover{border-color:var(--green)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
fieldset{border:none;padding:0;margin:0;min-width:0}
.field{margin-bottom:18px}
.err{color:#9B2C2C;font-size:.8125rem;margin-top:6px}
:root[data-theme="dark"] .err{color:#F3A6A6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#F3A6A6}}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg label{margin:0;padding:0;cursor:pointer;font-weight:500;position:relative}
.seg span{display:block;padding:9px 18px}
.seg input{position:absolute;opacity:0;pointer-events:none;left:0;top:0}
.seg input:checked+span{background:var(--btn-bg);color:var(--btn-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-3px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;align-items:center;gap:10px;margin:0;font-weight:400;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--green);margin:0}
.file label.btn{margin:0}
.file:focus-within label.btn{outline:2px solid var(--accent);outline-offset:3px}

/* research */

  case 2:return '<path d="M'+x+' '+(y-r*1.3)+'L'+(x+r*1.3)+' '+y+'L'+x+' '+(y+r*1.3)+'L'+(x-r*1.3)+' '+y+'Z" '+f+'/>';
  case 3:return '<path d="M'+x+' '+(y-r*1.2)+'L'+(x+r*1.1)+' '+(y+r*.9)+'L'+(x-r*1.1)+' '+(y+r*.9)+'Z" '+f+'/>';
  case 4:return '<path d="M'+(x-r)+' '+y+'H'+(x+r)+'M'+x+' '+(y-r)+'V'+(y+r)+'" stroke="'+c+'" stroke-width="2.4" fill="none"/>';

  var legend='<ul class="legend">'+vis.map(function(v){return '<li><svg width="14" height="14" viewBox="-7 -7 14 14" aria-hidden="true">'+marker(v.k,0,0,4.5)+'</svg>'+esc(v.s.name)+'</li>'}).join('')+'</ul>';
  host.innerHTML='<div class="cw" role="group" aria-label="Interactive chart. Use left and right arrow keys to read values." tabindex="0"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+wm+body+'<line class="cx" y1="'+m.t+'" y2="'+(m.t+ih)+'" style="display:none"/><g class="hd"></g></svg><div class="tip" hidden></div></div>'+legend;
  var cw=$('.cw',host),svg=$('svg',cw),tip=$('.tip',cw),cx=$('.cx',svg),hd=$('.hd',svg),cur=-1;

var EX={ds:SAMPLE,ind:0,on:[true,true,true],type:'line',from:0,to:SAMPLE.x.length-1,table:false};
function exRange(){var a=[];for(var i=EX.from;i<=EX.to;i++)a.push(i);return a}
function exCSV(){var ind=EX.ds.indicators[EX.ind],idx=exRange(),q=function(s){s=String(s);return/[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var vs=[];ind.series.forEach(function(s,k){if(EX.on[k])vs.push(s)});
  var lines=[[EX.ds.xlabel+(EX.ds.sample?' (sample data)':'')].concat(vs.map(function(s){return s.name})).map(q).join(',')];
  idx.forEach(function(i){lines.push([EX.ds.x[i]].concat(vs.map(function(s){return s.values[i]})).map(q).join(','))});return lines.join('\n')}
function parseCSV(t){var rows=[],row=[],cur='',q=false,i;for(i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(function(r){return r.some(function(c){return c.trim()!==''})})}
function parseDataset(text,name){
  var rows=parseCSV(text);
  if(rows.length<3)throw new Error('The file needs a header row and at least two data rows.');
  var head=rows[0].map(function(h){return h.trim()});
  if(head.length<2)throw new Error('Add at least one column of numbers after the label column.');
  if(rows.length>301)throw new Error('The file has more than 300 rows. Try a shorter file.');
  var nS=Math.min(head.length-1,6),x=[],S=[];for(var c=1;c<=nS;c++)S.push({name:head[c]||'Series '+c,values:[]});
  for(var r=1;r<rows.length;r++){x.push((rows[r][0]||'').trim()||String(r));for(c=1;c<=nS;c++){var raw=String(rows[r][c]==null?'':rows[r][c]).trim(),v=Number(raw);if(raw===''||!isFinite(v))throw new Error('Row '+(r+1)+', column "'+(head[c]||c)+'" is not a number.');S[c-1].values.push(v)}}
  return{sample:false,file:name,xlabel:head[0]||'Label',x:x,indicators:[{id:'u',name:'Your data',unit:'',desc:'Columns from the file you chose.',read:'Values are drawn exactly as supplied.',series:S}]};
}

PAGES.contact=function(){
  var types=COLLAB.map(function(c){return c.t}).concat(['Other']);
  var soc=SITE.social.map(function(s){return '<li>'+(s.href?'<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':'<span class="ph-link">'+esc(s.label)+' <span class="phb">Add link</span></span>')+'</li>'}).join('');
  return '<section class="wrap page-head"><p class="eyebrow">Contact</p><h1>Get in touch</h1><p class="lead">For research collaboration, professional enquiries and knowledge exchange.</p></section>'
  +'<div class="wrap contact-grid"><form id="cform" novalidate aria-label="Contact form">'
  +'<div class="field"><label for="f-type">Type of enquiry</label><select id="f-type">'+types.map(function(t){return '<option'+(ST.enq===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div>'
  +'<div class="field"><label for="f-name">Name</label><input type="text" id="f-name" autocomplete="name" required><div class="err" id="e-name" hidden></div></div>'
  +'<div class="field"><label for="f-email">Email</label><input type="email" id="f-email" autocomplete="email" required><div class="err" id="e-email" hidden></div></div>'
  +'<div class="field"><label for="f-org">Organisation (optional)</label><input type="text" id="f-org" autocomplete="organization"></div>'
  +'<div class="field"><label for="f-msg">Message</label><textarea id="f-msg" required></textarea><div class="err" id="e-msg" hidden></div></div>'
  +'<button class="btn primary" type="submit" id="f-send">Send message</button><div id="f-status" role="status" style="margin-top:18px"></div></form>'
  +'<aside class="contact-side"><section><h2>Email</h2><p><span class="ph-text">'+esc(SITE.email)+'</span></p><p class="muted sm" style="margin-top:8px">Add your address in the site settings.</p></section><section><h2>Professional links</h2><ul>'+soc+'</ul></section><section><h2>Enquiries</h2><p class="muted">Research collaboration, professional enquiries and knowledge exchange are all welcome.</p></section></aside></div>';
};
BIND.contact=function(){
  var f=$('#cform'),status=$('#f-status');
  function setErr(id,t){var e=$('#e-'+id);e.textContent=t;e.hidden=!t;$('#f-'+id).setAttribute('aria-invalid',!!t)}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var d={type:$('#f-type').value,name:$('#f-name').value.trim(),email:$('#f-email').value.trim(),organisation:$('#f-org').value.trim(),message:$('#f-msg').value.trim()};
    var bad=null;
    setErr('name',d.name?'':'Enter your name.');if(!d.name)bad=bad||'name';
    var okE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);setErr('email',okE?'':'Enter an email address such as name@example.org.');if(!okE)bad=bad||'email';
    setErr('msg',d.message?'':'Write a short message.');if(!d.message)bad=bad||'msg';
    if(bad){$('#f-'+bad).focus();status.innerHTML='';return}
    if(!SITE.formEndpoint){
      var text='Type: '+d.type+'\nName: '+d.name+'\nEmail: '+d.email+(d.organisation?'\nOrganisation: '+d.organisation:'')+'\n\n'+d.message;
      status.innerHTML='<div class="notice"><strong>Nothing was sent.</strong> This form is not connected to a mail service yet. To receive messages, add a form service address (for example from Formspree) as formEndpoint in the site settings. Until then, copy the message and send it by email.<div style="margin-top:12px"><button class="btn sm" type="button" id="f-copy">Copy message</button></div><div id="f-fb"></div></div>';
      $('#f-copy').onclick=function(e){copyText(text,e.currentTarget,$('#f-fb'))};return}
    var btn=$('#f-send');btn.disabled=true;btn.textContent='Sending…';status.innerHTML='';
    fetch(SITE.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)})
      .then(function(r){if(!r.ok)throw new Error('bad');f.reset();status.innerHTML='<div class="notice info"><strong>Message sent.</strong> Thank you for writing.</div>'})
      .catch(function(){status.innerHTML='<div class="notice"><strong>The message could not be sent.</strong> Check your connection and try again, or write to the email address shown on this page.</div>'})
      .then(function(){btn.disabled=false;btn.textContent='Send message'});
  });
};

/* 404 */
PAGES.notfound=function(){return '<section class="wrap page-head"><p class="eyebrow">Page not found</p><h1>That page does not exist</h1><p class="lead">The address may be out of date. Return to the home page or open one of the sections.</p><div class="cta" style="margin-top:28px"><a class="btn primary" href="#home">Go home</a><a class="btn" href="#research">Browse research</a></div></section>'};

/* ============ shell, router ============ */
var DESC={home:'MUGABE ALEX is an independent researcher. Research. Evidence. Perspective.',research:'Research projects, questions and methods.',publications:'Papers, technical reports, policy briefs, working papers and articles.',data:'Interactive charts, indicator explanations, sources and methods.',about:'About MUGABE ALEX, independent researcher.',contact:'Contact MUGABE ALEX for research collaboration and professional enquiries.'};
function parse(){var h=(location.hash||'#home').slice(1);if(h.indexOf('project-')===0){var p=PROJECTS.filter(function(x){return x.id===h.slice(8)})[0];return p?{page:'project',p:p}:{page:'notfound'}}
  for(var i=0;i<NAV.length;i++)if(NAV[i][0]===h)return{page:h};return{page:'notfound'}}
var first=true;
function route(){
  OBS.forEach(function(o){o.disconnect()});OBS.length=0;
  var r=parse(),main=$('#main');
  main.innerHTML=PAGES[r.page](r);
  var label=r.page==='home'?'MUGABE ALEX | Independent Researcher':r.page==='project'?r.p.title+' | MUGABE ALEX':r.page==='notfound'?'Page not found | MUGABE ALEX':(NAV.filter(function(n){return n[0]===r.page})[0][1])+' | MUGABE ALEX';
  document.title=label;var md=$('meta[name=description]');if(md)md.setAttribute('content',r.page==='project'?r.p.summary:(DESC[r.page]||DESC.home));
  var cur=r.page==='project'?'research':r.page;
  $$('#nav a').forEach(function(a){if(a.getAttribute('href')==='#'+cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');
  if(BIND[r.page])BIND[r.page](r);
  window.scrollTo(0,0);
  if(!first)main.focus({preventScroll:true});first=false;
}
function shell(){
  $('#nav').innerHTML=NAV.map(function(n){return '<a href="#'+n[0]+'">'+n[1]+'</a>'}).join('');
  var soc=SITE.social.map(function(s){return '<li>'+(s.href?'<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':'<span class="ph-link">'+esc(s.label)+' (add link)</span>')+'</li>'}).join('');
  $('#foot').innerHTML='<div class="wrap"><div class="foot-grid"><div><a class="brand" href="#home"><span class="mono">MA<i>.</i></span><span class="wm">MUGABE ALEX</span></a><p>Research. Evidence. Perspective.</p></div>'
   +'<div><h4>Explore</h4><ul>'+NAV.slice(1,4).map(function(n){return '<li><a href="#'+n[0]+'">'+n[1]+'</a></li>'}).join('')+'</ul></div>'
   +'<div><h4>Contact</h4><ul><li><a href="#about">About</a></li><li><a href="#contact">Contact form</a></li><li><span class="ph-link">'+esc(SITE.email)+'</span></li></ul></div>'
   +'<div><h4>Elsewhere</h4><ul>'+soc+'</ul></div></div>'
   +'<div class="foot-base"><span>© '+new Date().getFullYear()+' MUGABE ALEX</span><span>Items tagged Placeholder are example content to be replaced.</span></div></div>';
  $('#skip').onclick=function(e){e.preventDefault();$('#main').focus()};
  $('#menu').onclick=function(){var o=$('#nav').classList.toggle('open');this.setAttribute('aria-expanded',o);this.setAttribute('aria-label',o?'Close menu':'Open menu')};
  $('#theme').onclick=function(){var d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,n=dark?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('ma-theme',n)}catch(e){}};
  try{var t=localStorage.getItem('ma-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
}
shell();
window.addEventListener('hashchange',route);
route();
})();
</script>
